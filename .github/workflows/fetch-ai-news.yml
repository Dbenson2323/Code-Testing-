name: Fetch daily AI research news

# Note: GitHub only fires the `schedule` trigger for workflow files that
# live on the repository's default branch, so the daily cron activates
# once this file is merged to main. Until then (or any time), trigger it
# by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest AI news
        run: npm run fetch:news

      - name: Commit updated data if changed
        run: |
          git config user.name "ai-research-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/ai-stories.json; then
            echo "No new stories, nothing to commit."
          else
            git add data/ai-stories.json
            git commit -m "chore: daily AI research feed update"
            git push
          fi
