name: Fetch real estate data

# Note: GitHub only fires the `schedule` trigger for workflow files on the
# repository's default branch. Trigger by hand from the Actions tab with
# "Run workflow" any time before/without that. Interest rates and RSS news
# don't change hourly, but running every 6 hours (rather than once a day)
# keeps the page closer to "current" without needing a live on-click
# refetch — which a public static site can't safely offer anyway (that
# would require embedding a write-capable GitHub token in the page).
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest real estate data
        run: npm run fetch:real-estate

      - name: Commit updated data if changed
        run: |
          git config user.name "real-estate-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/real-estate-rates.json data/real-estate-news.json; then
            echo "No changes, nothing to commit."
          else
            git add data/real-estate-rates.json data/real-estate-news.json
            git commit -m "chore: daily real estate data update"
            git push
          fi
